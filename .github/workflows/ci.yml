name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Syntax check every .mjs
        run: find src test scripts -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
      - name: JSON validity
        run: |
          for f in module.json lang/en.json data/izir/content.json data/ansu/content.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
      - name: Validate content
        run: npm run validate:content
      - name: Pack sources up to date
        run: |
          npm run build:pack-sources
          # `git diff` cannot see an UNTRACKED new file, so adding a content entry
          # without regenerating used to pass CI and ship a pack short of a
          # document. Porcelain sees added, deleted and modified alike. (F41)
          if [ -n "$(git status --porcelain src/packs)" ]; then
            echo "src/packs is stale — run npm run build:pack-sources and commit:"
            git status --porcelain src/packs
            exit 1
          fi

      - name: Compile the compendium packs
        run: npm run build:packs

      - name: Versions agree
        run: |
          node -e '
            const fs = require("fs");
            const mod = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const problems = [];
            if (mod.version !== pkg.version) {
              problems.push(`module.json ${mod.version} != package.json ${pkg.version}`);
            }
            if (!String(mod.download ?? "").includes(`/v${mod.version}/`)) {
              problems.push(`download URL does not name v${mod.version}: ${mod.download}`);
            }
            if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
            console.log(`versions agree: ${mod.version}`);
          '

